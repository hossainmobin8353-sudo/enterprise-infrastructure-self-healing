[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "enterprise-selfheal-lab"
version = "1.0.0"
description = "Approval-controlled enterprise service health and remediation lab"
requires-python = ">=3.10"
[project.scripts]
selfheal = "selfheal.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
